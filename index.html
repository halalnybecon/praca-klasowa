<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista zakupów</title>
    <style>
        #addButton {
           
            width: 120px;
        }
        
    </style>
</head>
<body>
    <h2>Lista zakupów</h2>

    <label for="nameInput">Wpisz nazwę produktu</label>
    <input type="text" id="nameInput">
    <label for="quantityInput">Wpisz ilość produktów</label>
    <input id="quantityInput" type="text">
    <button id="addButton">Dodaj</button>

    <div id="errorMessage">

    </div>
    <br><label for="filterSelect">Pokaż</label>
    <select id="filterSelect">
        <option id="all">Wszystkie</option>
        <option id="toBuy">Do kupienia</option>
        <option id="bought">Kupione</option>
    </select>

    <div id="counter">Counter: Do kupienia 2</div>

    <div id="listContainer">

    </div>
    <button id="clearBoughtButton">Usuń wszystko</button>
    <script src="public/main.js"></script>
</body>
</html>
